user nginx;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    ############################################################
    # SERVEUR HTTP → redirection vers HTTPS
    # + autorisation Let's Encrypt (certbot)
    ############################################################
    server {
        listen 80;
        server_name stage-manager.fr www.stage-manager.fr;

        # Pour validation Let’s Encrypt
        location /.well-known/acme-challenge/ {
            root /usr/share/nginx/html;
        }

        # Redirection vers HTTPS
        return 301 https://$host$request_uri;
    }

    ############################################################
    # SERVEUR HTTPS (LE VRAI SITE)
    ############################################################
    server {
        listen 443 ssl;
        server_name stage-manager.fr www.stage-manager.fr;

        # Certificats Let's Encrypt
        ssl_certificate     /etc/letsencrypt/live/stage-manager.fr/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/stage-manager.fr/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        ########################################################
        # FRONT REACT
        ########################################################
        location / {
            root /usr/share/nginx/html;
            try_files $uri /index.html;
        }

        ########################################################
        # API LARAVEL
        ########################################################
        location /api {
            alias /var/www/html/public;
            try_files $uri /index.php?$query_string;
        }

        ########################################################
        # PHP-FPM (backend Laravel)
        ########################################################
        location ~ \.php$ {
            root /var/www/html/public;
            fastcgi_pass laravel:9000;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
        }
    }
}
