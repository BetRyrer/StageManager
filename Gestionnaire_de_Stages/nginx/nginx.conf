user nginx;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    ############################################################
    # SERVEUR HTTP → redirection vers HTTPS + Let’s Encrypt
    ############################################################

    server {
        listen 80;
        server_name stage-manager.fr www.stage-manager.fr;

        # Pour validation Let’s Encrypt
        location /.well-known/acme-challenge/ {
            root /usr/share/nginx/html;
        }

        # Redirection vers HTTPS
        return 301 https://$host$request_uri;
    }


    ############################################################
    # SERVEUR HTTPS PRINCIPAL
    ############################################################
    server {
        listen 443 ssl;
        server_name stage-manager.fr www.stage-manager.fr;

        # Certificats Let's Encrypt
        ssl_certificate     /etc/letsencrypt/live/stage-manager.fr/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/stage-manager.fr/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;


        ########################################################
        # FRONTEND REACT
        ########################################################
        location / {
            root /usr/share/nginx/html;
            try_files $uri /index.html;
        }


        ########################################################
        # API LARAVEL (corrigé)
        ########################################################
        location /api {
            # On utilise index.php pour toutes les routes Laravel
            try_files $uri /index.php?$query_string;
        }


        ########################################################
        # TRAITEMENT DES FICHIERS PHP (Backend Laravel)
        ########################################################
        location ~ \.php$ {
            root /var/www/html/public;
            include fastcgi_params;

            # Passage correct du fichier script à PHP-FPM
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_script_name;

            # Socket / container PHP-FPM
            fastcgi_pass laravel:9000;

            # IMPORTANT : préserver le header Authorization
            fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        }
    }
}
